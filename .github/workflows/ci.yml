name: Notebook CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML
        run: |
          test -f index.html
          echo "index.html exists."

      - name: CI passed
        run: echo "All checks passed successfully!"